[package]
name = "incrust"
version = "0.0.1"
authors = ["Robin Candau <robincandau@mailbox.org>"]
edition = "2024"
description = "A minimal incremental / idle terminal game about compiling stuff"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
ctrlc = "3.5.2"
dirs = "7.0.0"
fs2 = "0.4.3"
rand = "0.10.3"
rustyline = "19.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
which = "8.0.6"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
